<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">

    <ui:composition template="/templates/template.xhtml">
        <ui:define name="title">Đăng Nhập Tài Khoản - Gaming Gear Store</ui:define>

        <ui:define name="content">
            <div class="form-card">
                <div style="text-align: center; margin-bottom: 28px;">
                    <div style="font-family: 'Rajdhani', sans-serif; font-size: 2.2rem; font-weight: 700;">
                        ĐĂNG <span style="color: var(--primary);">NHẬP</span>
                    </div>
                    <p style="color: var(--text-muted); font-size: 0.92rem; margin-top: 6px;">
                        Chào mừng bạn quay trở lại với Gaming Gear Store!
                    </p>
                </div>

                <!-- Alert Error Message -->
                <ui:fragment rendered="#{not empty authMB.loginMessage}">
                    <div class="alert alert-danger">
                        <i class="fa-solid fa-triangle-exclamation" style="margin-right: 8px;"></i>
                        #{authMB.loginMessage}
                    </div>
                </ui:fragment>

                <h:form id="loginForm">
                    <div class="form-group">
                        <label class="form-label">Tên đăng nhập (*)</label>
                        <h:inputText id="username" value="#{authMB.username}" styleClass="form-control" required="true"
                                     requiredMessage="Vui lòng nhập tên đăng nhập!"
                                     placeholder="Tên tài khoản (vd: admin hoặc gamer1)" />
                        <h:message for="username" styleClass="error-message" />
                    </div>

                    <div class="form-group">
                        <label class="form-label">Mật khẩu (*)</label>
                        <h:inputSecret id="password" value="#{authMB.password}" styleClass="form-control" required="true"
                                       requiredMessage="Vui lòng nhập mật khẩu!"
                                       placeholder="••••••••" />
                        <h:message for="password" styleClass="error-message" />
                    </div>

                    <div style="margin-bottom: 24px;">
                        <h:commandButton value="Đăng Nhập" action="#{authMB.login()}" styleClass="btn btn-primary" style="width: 100%; padding: 12px; font-size: 1rem;" />
                    </div>

                    <div style="text-align: center; font-size: 0.92rem; color: var(--text-muted);">
                        Chưa có tài khoản? <h:link outcome="/register.xhtml" style="color: var(--primary); font-weight: 600;">Đăng ký tài khoản mới</h:link>
                    </div>

                    <div style="margin-top: 24px; padding: 14px; background: var(--bg-surface); border-radius: var(--radius-md); font-size: 0.82rem; color: var(--text-dim);">
                        <strong style="color: var(--text-muted);">Tài khoản mẫu để test:</strong><br />
                        - Admin: <code>admin</code> / <code>123456</code><br />
                        - Customer: <code>gamer1</code> / <code>123456</code>
                    </div>
                </h:form>
            </div>
        </ui:define>
    </ui:composition>
</html>
