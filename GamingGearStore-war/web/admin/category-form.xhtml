<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">

    <ui:composition template="/templates/admin-template.xhtml">
        <ui:define name="title">#{adminMB.editingCategory.categoryID == null ? 'Thêm Mới' : 'Cập Nhật'} Danh Mục - Gaming Gear Store</ui:define>

        <ui:define name="content">
            <div class="admin-header">
                <div>
                    <h1 class="page-title">#{adminMB.editingCategory.categoryID == null ? 'THÊM MỚI DANH MỤC' : 'CẬP NHẬT DANH MỤC'}</h1>
                    <p style="color: var(--text-muted); font-size: 0.92rem; margin-top: 4px;">
                        Quản lý nhóm phân loại thiết bị gaming
                    </p>
                </div>
                <h:link outcome="/admin/categories.xhtml" styleClass="btn btn-outline">
                    <i class="fa-solid fa-arrow-left"></i> Quay Lại Danh Sách
                </h:link>
            </div>

            <div class="form-card" style="max-width: 650px; margin: 0;">
                <h:form id="categoryEditForm">
                    <h:inputHidden value="#{adminMB.editingCategory.categoryID}" />

                    <div class="form-group">
                        <label class="form-label">Tên danh mục phụ kiện (*)</label>
                        <h:inputText id="cName" value="#{adminMB.editingCategory.categoryName}" styleClass="form-control" required="true"
                                     requiredMessage="Tên danh mục không được để trống!">
                            <f:validateLength minimum="3" maximum="100" />
                        </h:inputText>
                        <h:message for="cName" styleClass="error-message" />
                    </div>

                    <div class="form-group">
                        <label class="form-label">Mô tả tóm tắt danh mục</label>
                        <h:inputTextarea id="cDesc" value="#{adminMB.editingCategory.description}" rows="4" styleClass="form-control" 
                                         placeholder="Mô tả nhóm sản phẩm..." />
                    </div>

                    <div style="display: flex; gap: 14px; margin-top: 30px;">
                        <h:commandButton value="Lưu Danh Mục" action="#{adminMB.saveCategory()}" styleClass="btn btn-primary" style="padding: 12px 30px;" />
                        <h:link outcome="/admin/categories.xhtml" styleClass="btn btn-outline" style="padding: 12px 24px;">Hủy Bỏ</h:link>
                    </div>
                </h:form>
            </div>
        </ui:define>
    </ui:composition>
</html>
